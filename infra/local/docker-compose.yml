# Local development dependencies only (PRD §17.7).
# Application services run from the workspace via `pnpm dev`, not in Docker, so
# the edit/reload loop stays fast.
services:
  redis:
    image: redis:7-alpine
    container_name: nightcell7-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
