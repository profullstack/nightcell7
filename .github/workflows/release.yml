name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Production deploy permissions are limited (PRD §33.4).
permissions:
  contents: write

jobs:
  verify:
    name: Full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Release load gate
        run: pnpm loadtest -- --rooms 20 --matches 50

  desktop:
    name: Desktop packages
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32
          - os: macos-latest
            target: darwin
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make
        run: pnpm --filter @nightcell7/desktop make
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Checksums
        shell: bash
        run: |
          cd apps/desktop/out/make
          find . -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nightcell7-${{ matrix.target }}
          path: apps/desktop/out/make/**
