<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NIGHTCELL 7 — Tactical asset study</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111918;
        color: #e8e5d9;
        font:
          14px system-ui,
          sans-serif;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 24px 32px 20px;
        border-bottom: 1px solid #36403b;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-weight: 800;
        font-size: 21px;
        letter-spacing: 0.15em;
      }
      .tag {
        color: #acac8d;
        font-size: 11px;
        letter-spacing: 0.16em;
      }
      main {
        flex: 1;
        min-height: 250px;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      .info {
        position: absolute;
        top: 28px;
        left: 32px;
        pointer-events: none;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 0.08em;
        margin: 0 0 9px;
      }
      #status {
        color: #b9bdb1;
        font-size: 12px;
      }
      .hint {
        position: absolute;
        bottom: 20px;
        right: 32px;
        color: #afb8ab;
        font-size: 12px;
      }
      footer {
        padding: 18px 32px 24px;
        background: #17201e;
        border-top: 1px solid #36403b;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tabs,
      .options {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button {
        cursor: pointer;
        border: 1px solid #465045;
        padding: 12px 17px;
        color: #cbd0c2;
        background: transparent;
        font: inherit;
      }
      button[aria-pressed="true"] {
        background: #bbb88b;
        color: #151c19;
        border-color: #bbb88b;
      }
      button:hover {
        border-color: #d0cbaa;
      }
      label {
        font-size: 12px;
        cursor: pointer;
      }
      a {
        color: #c1bb8f;
      }
      .subtitle {
        margin-top: 4px;
        color: #828e83;
        font-size: 11px;
      }
      @media (max-width: 650px) {
        header,
        footer {
          padding: 16px;
        }
        .tag {
          max-width: 150px;
          text-align: right;
          line-height: 1.6;
        }
        .info {
          left: 16px;
        }
        .hint {
          right: 16px;
        }
        .tabs {
          width: 100%;
        }
        .tabs button {
          flex: 1;
          font-size: 12px;
          padding: 11px 6px;
        }
        .brand {
          font-size: 15px;
        }
        h1 {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="brand">NIGHTCELL 7</div>
        <div class="subtitle">TACTICAL ASSET STUDY / 01</div>
      </div>
      <div class="tag">ORIGINAL GAME GEOMETRY<br />EDITABLE REVIEW BUILD</div>
    </header>
    <main>
      <canvas id="view" aria-label="Interactive 3D asset preview"></canvas>
      <div class="info">
        <h1 id="title">C7 / CARBINE</h1>
        <div id="status">Loading geometry…</div>
      </div>
      <div class="hint">Drag to orbit · Scroll to zoom</div>
    </main>
    <footer>
      <div class="tabs">
        <button data-asset="0" aria-pressed="true">01 / Carbine</button
        ><button data-asset="1" aria-pressed="false">02 / Field case</button
        ><button data-asset="2" aria-pressed="false">03 / Cover</button>
      </div>
      <div class="options">
        <button id="rotate">Auto rotate</button
        ><label><input type="checkbox" id="wire" /> Wireframe</label><a href="README.md">Notes</a>
      </div>
    </footer>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
