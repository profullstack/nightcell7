# NIGHTCELL 7 desktop packaging.
#
# electron-builder rather than Forge, matching the pattern proven on
# pairux.com: it produces the package formats the OS package managers actually
# want (dmg/zip, nsis, AppImage/deb/rpm) from one config.
#
# The app is a thin wrapper around the same web build, so packages stay small
# and there is no per-platform game content to bundle.
appId: com.nightcell7.game
productName: NIGHTCELL 7
copyright: Copyright 2026 Profullstack, Inc.

directories:
  output: out
  buildResources: resources

icon: resources/icon.png

files:
  - dist/**/*
  - resources/**/*
  - "!**/*.map"
  - "!**/node_modules/**/{CHANGELOG.md,README.md,LICENSE*}"

asar: true

mac:
  artifactName: "nightcell7-${version}-mac-${arch}.${ext}"
  category: public.app-category.action-games
  target:
    - dmg
    - zip
  # Hardened runtime is required for notarization. Signing only happens when
  # the release workflow supplies credentials; local builds stay unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

win:
  artifactName: "nightcell7-${version}-win-${arch}.${ext}"
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: NIGHTCELL 7

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Game
  maintainer: Profullstack, Inc.
  synopsis: Two operatives. Two countries. One manufactured war.
  artifactName: "nightcell7-${version}-linux-${arch}.${ext}"
  executableName: nightcell7
  # A flat map of .desktop keys. electron-builder 25 does not take a nested
  # `entry:` here: it stringified the whole block into the line
  # `entry=[object Object]`, so none of these keys ever reached the file.
  # Categories is not set here: `category` above writes it, and wins.
  desktop:
    Keywords: fps;shooter;nightcell;
    # Lets the desktop environment match the running window to this entry, so
    # the taskbar uses the entry's Icon. It must equal the window's WM_CLASS,
    # which Electron takes from the npm package name, not from productName:
    # read off a running v0.2.0 build under Xvfb, it is "@nightcell7/desktop".
    # "NIGHTCELL 7" matched nothing. Renaming the app to change the class
    # would also move Electron's userData directory and strand every v0.1.0
    # player's local save, so the entry follows the class instead.
    StartupWMClass: "@nightcell7/desktop"

deb:
  packageName: nightcell7
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

rpm:
  packageName: nightcell7

publish:
  provider: github
  owner: profullstack
  repo: nightcell7
